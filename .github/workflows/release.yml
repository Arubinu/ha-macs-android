# Tag de version poussé (v1.2.3, v1.2.3-beta…) : compile l'app et joint les APK (un par architecture + un universel)
# à une Release brouillon de ce tag, créée si besoin (préversion si le tag contient un « - »). On relit, on complète
# les notes et on publie à la main : la publication ne recompile rien, et un échec ne laisse aucune Release publiée.
# Relancer sur un tag existant (onglet Actions) remplace les APK.
# Secrets requis : RELEASE_KEYSTORE_BASE64 (fichier .jks encodé en base64), RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK : déjà installé sur les machines ubuntu de GitHub (ANDROID_HOME, licences acceptées).
      # (android-actions/setup-android@v3 échoue : il demande le paquet « tools », retiré de sdkmanager.)

      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Secret RELEASE_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$KEYSTORE" | base64 -d > release.jks

      - name: Compilation
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: APK nommés avec la version
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/ha-macs-android-${tag}-${abi}.apk"
          done
          ls -la dist

      - name: Ajout à la Release (brouillon créé si besoin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) echo "Lancer depuis un tag v… (pas $tag)"; exit 1 ;; esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" --draft $pre --title "$tag" --notes "Notes à compléter avant publication."
          fi
          gh release upload "$tag" dist/*.apk --clobber

      - name: Nettoyage
        if: always()
        run: rm -f release.jks
