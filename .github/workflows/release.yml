# Publication d'une Release GitHub : compile l'app et joint les APK (un par architecture + un universel).
# Secrets requis : RELEASE_KEYSTORE_BASE64 (fichier .jks encodé en base64), RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Secret RELEASE_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$KEYSTORE" | base64 -d > release.jks

      - name: Compilation
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: APK nommés avec la version
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/ha-macs-android-${tag}-${abi}.apk"
          done
          ls -la dist

      - name: Ajout à la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber

      - name: Nettoyage
        if: always()
        run: rm -f release.jks
